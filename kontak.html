<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tambahan style khusus untuk form kontak */
        .contact-form {
            max-width: 600px;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }
        .form-group textarea {
            height: 150px;
            resize: vertical;
        }
        .btn-submit {
            background-color: #1f5faa;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-submit:hover {
            background-color: #2b83ea;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>Layout Sederhana</h1>
        </header>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>
        
        <section id="hero">
            <h1>Hubungi Kami</h1>
            <p>Silakan isi formulir di bawah ini untuk mengirimkan pesan, pertanyaan, atau masukan kepada kami.</p>
        </section>
        
        <section id="wrapper">
            <section id="main" style="width: 100%; float: none;">
                <h2>Formulir Kontak</h2>
                <p>Ada hal yang ingin ditanyakan? Jangan ragu untuk mengisi form berikut:</p>
                
                <div class="contact-form">
                    <form action="#" method="post">
                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda..." required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Alamat Email</label>
                            <input type="email" id="email" name="email" placeholder="Masukkan email aktif Anda..." required>
                        </div>
                        
                        <div class="form-group">
                            <label for="pesan">Pesan</label>
                            <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn-submit">Kirim Pesan</button>
                    </form>
                </div>
            </section>
        </section>
        
        <footer>
            <p>&copy; 2021 - Universitas Pelita Bangsa</p>
        </footer>
    </div>
</body>
</html>
